name: sta
description: "STA Ride - Smart Transport App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^8.1.0
  flutter_tts: ^4.0.2
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  
  # State Management
  provider: ^6.0.5
  web: ^1.0.0
  postgres: ^3.0.0
  supabase_flutter: ^2.9.1

  # Maps
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.3
  osm_nominatim: ^4.0.1
  shared_preferences: ^2.5.5
  # Communication
  audioplayers: ^6.0.0
  agora_rtc_engine: ^6.5.4
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  sqflite: ^2.4.1
  path: ^1.9.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  fl_chart: ^1.2.0
  http: ^1.1.0
  screenshot: ^3.0.0
  image_gallery_saver_plus: ^5.0.0
  exif: ^3.3.0
  path_provider: ^2.1.3
  google_mlkit_face_detection: ^0.13.2
  google_mlkit_commons: ^0.11.1
  camera: ^0.12.0+1
  flutter_local_notifications: ^22.0.1
  speech_to_text: ^7.4.0
  flutter_background_service: ^5.1.0
  pdf: ^3.10.8
  printing: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: "assets/rider_icon.png"
  flavors:
    rider:
      image_path: "assets/rider_icon.png"
    driver:
      image_path: "assets/driver_icon.png"
    admin:
      image_path: "assets/admin_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/rider_icon.png
    - assets/driver_icon.png
    - assets/admin_icon.png
    - assets/images/
    - assets/lang/
    - assets/sounds/
